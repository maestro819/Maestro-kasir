<!-- ========================================== -->
<!-- 1. POPUP / MODAL PIN (Tampil saat buka Kelola Toko) -->
<!-- ========================================== -->
<div id="pinModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center;">
  <div style="background: white; padding: 24px; border-radius: 16px; width: 90%; max-width: 320px; text-align: center;">
    <div style="font-size: 32px; margin-bottom: 8px;">🔒</div>
    <h3 style="margin: 0 0 8px 0; font-size: 18px; font-weight: bold;">Akses Kelola Toko</h3>
    <p style="font-size: 12px; color: #666; margin-bottom: 16px;">Masukkan PIN Pemilik untuk mengelola stok</p>
    
    <input type="password" id="inputPinToko" placeholder="Masukkan PIN" maxlength="6" style="width: 100%; text-align: center; font-size: 20px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 12px; box-sizing: border-box;">
    
    <p id="pinErrorMsg" style="color: red; font-size: 12px; display: none; margin-bottom: 10px;">PIN Salah! Coba lagi.</p>
    
    <button onclick="verifikasiPin()" style="width: 100%; background: #f97316; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;">
      Buka Akses
    </button>
  </div>
</div>

<!-- ========================================== -->
<!-- 2. SCRIPT JAVASCRIPT LOGIC -->
<!-- ========================================== -->
<script>
  // PIN Toko Anda
  const PIN_TOKO = "123456"; // <--- Ganti dengan PIN Anda
  let isUnlocked = false; // Status apakah PIN sudah dimasukkan

  // Fungsi saat Tab "Kelola Toko" diklik
  function bukaTabKelolaToko() {
    if (!isUnlocked) {
      // Jika belum di-PIN, tampilkan Modal PIN
      document.getElementById('pinModal').style.display = 'flex';
      document.getElementById('inputPinToko').value = '';
      document.getElementById('pinErrorMsg').style.display = 'none';
    }
  }

  // Verifikasi PIN
  function verifikasiPin() {
    const pinInput = document.getElementById('inputPinToko').value;
    if (pinInput === PIN_TOKO) {
      isUnlocked = true;
      document.getElementById('pinModal').style.display = 'none';
      alert("Akses Kelola Toko Berhasil!");
    } else {
      document.getElementById('pinErrorMsg').style.display = 'block';
    }
  }

  // FITUR 1: Tambah Produk Baru (TANPA PIN)
  function tambahProdukBaru(event) {
    if (event) event.preventDefault();
    
    // Logic simpan produk baru milik Anda dimasukkan di sini...
    alert("Produk berhasil ditambahkan!");
  }

  // FITUR 2: Edit Stok (TANPA PIN & Langsung Berfungsi)
  function editStokProduk(idProduk, namaProduk, stokSekarang) {
    // Memakai Prompt bawaan browser (Simpel & Pasti Berfungsi)
    let stokBaru = prompt(`Masukkan stok baru untuk ${namaProduk}:`, stokSekarang);
    
    if (stokBaru !== null && stokBaru !== "") {
      let angkaStok = parseInt(stokBaru);
      if (!isNaN(angkaStok)) {
        // PERBAIKAN BUG: Update stok ke database/state Anda di sini
        alert(`Stok ${namaProduk} berhasil diubah menjadi ${angkaStok}!`);
        // renderUlangKatalog(); // panggil fungsi render tabel Anda
      } else {
        alert("Harap masukkan angka yang valid!");
      }
    }
  }

  // FITUR 3: Hapus Produk (KONFIRMASI DIALOG TANPA PIN)
  function hapusProduk(idProduk, namaProduk) {
    let konfirmasi = confirm(`Apakah Anda yakin ingin menghapus "${namaProduk}"?`);
    if (konfirmasi) {
      // Logic hapus produk milik Anda dimasukkan di sini...
      alert(`Produk "${namaProduk}" berhasil dihapus.`);
      // renderUlangKatalog(); // panggil fungsi render tabel Anda
    }
  }
</script>
